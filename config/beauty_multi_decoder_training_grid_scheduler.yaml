name: beauty_multi_decoder_training_grid_v2
poll_interval_seconds: 15
effective_batch_size: 64
experiments:
- name: beauty_multi_train_u1_s1_a0
  args:
    config: config/trainer/sid-uid-content-multi-decoder.yaml
    data: beauty
    model: scratch
    main_metric: ndcg@10|loss
    maxitems: 256
    batch_size: 16
    accumulate_batch: 4
    code_beam_chunk_size: 80
    multi_uid_weight: 0.5
    representation_pair_bias: true
    representation_pair_bias_mode: head
    representation_pair_bias_residual_scale: 0.03
    seed: 42
    sid_codebook_size: 128
    content_embedding_normalize: false
    content_embedding_dim: 0
    multi_uid_loss_weight: 1
    multi_sid_loss_weight: 1
    alignment: 0
  batch_size_cap: 16
