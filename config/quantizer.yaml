embedding:
  models: ${embedding_models:null}$
  normalize: ${embedding_normalize:null}$
  reduce_dims: ${embedding_reduce_dims:null}$
  weights: ${embedding_weights:null}$
  fusion: ${embedding_fusion:concat}$
  normalize_output: ${embedding_normalize_output:false}$
  seed: 42
  word2vec:
    vector_size: ${embedding_word2vec_vector_size:64}$
    window: ${embedding_word2vec_window:5}$
    patience: ${embedding_word2vec_patience:5}$
    sg: ${embedding_word2vec_sg:1}$
    negative: ${embedding_word2vec_negative:5}$
    min_count: ${embedding_word2vec_min_count:1}$
    max_epochs: ${embedding_word2vec_max_epochs:100}$
    learning_rate: ${embedding_word2vec_learning_rate:0.003}$
    batch_size: ${embedding_word2vec_batch_size:8192}$
    valid_batch_size: ${embedding_word2vec_valid_batch_size:16384}$
    min_delta: ${embedding_word2vec_min_delta:0.0001}$

quantizer:
  name: ${quantizer_name:rqvae}
  config:
    latent_dim: ${latent_dim:64}$
    reconstruction_loss: mse
    codebook_size: ${codebook_size:256}$
    commitment_weight: ${commitment_weight:0.25}$
    codebook_weight: ${codebook_weight:1.0}$
    use_ema_codebook: ${use_ema_codebook:true}$
    ema_decay: ${ema_decay:0.99}$
    ema_epsilon: ${ema_epsilon:0.00001}$
    dead_code_reset: ${dead_code_reset:false}$
    dead_code_threshold: ${dead_code_threshold:0}$
    num_quantizers: ${num_quantizers:3}$
    num_codebooks: ${num_codebooks:3}$
    assignment_strategy: ${assignment_strategy:sinkhorn}$
    sinkhorn_epsilon: ${sinkhorn_epsilon:0.0,0.0,0.003}$
    sinkhorn_iters: ${sinkhorn_iters:50}$
    kmeans_init: ${kmeans_init:true}$
    kmeans_iters: ${kmeans_iters:100}$

hash:
  config:
    num_bits: ${num_bits:24}$
    num_tables: ${num_tables:1}$
    projection_distribution: ${projection_distribution:gaussian}$
    use_median_thresholds: ${use_median_thresholds:true}$
    num_iterations: ${num_iterations:50}$
    normalize_inputs: ${normalize_inputs:true}$
    seed: ${hash_seed:42}$

encoder:
  name: mlp
  config:
    hidden_dims: ${hidden_dims:2048,1024,512,256,128}$
    activation: relu
    use_bias: true

trainer:
  output_dir: artifacts/quantized/${data}/${model}/${quantizer_name:rqvae}
  validation_ratio: ${validation_ratio:0.1}$
  test_ratio: ${test_ratio:0.1}$
  full_dataset_as_splits: true
  seed: ${seed:42}$
  epochs: ${epoch:0}$
  batch_size: ${batch_size:1000}$
  learning_rate: ${lr:0.001}$
  device: ${device:auto}$
  patience: ${patience:50}$
  advice: ${advice:true}$
  show_only_best_epochs: false
  display_metrics:
    coll: true
    commit: false
    codes: true
    recon: true
    dead: false
    ppl: false
    usage: false
    book: false
  save_best_by: ${save_best_by:loss,coll,codes,recon}$
  log_memory: false
