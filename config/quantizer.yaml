quantizer:
  name: rqvae
  config:
    latent_dim: ${latent_dim:32}$
    reconstruction_loss: mse
    codebook_size: ${codebook_size:256}$
    commitment_weight: ${commitment_weight:0.25}$
    codebook_weight: ${codebook_weight:1.0}$
    use_ema_codebook: ${use_ema_codebook:true}$
    ema_decay: ${ema_decay:0.99}$
    ema_epsilon: ${ema_epsilon:0.00001}$
    dead_code_reset: false
    dead_code_threshold: 0
    num_quantizers: ${num_quantizers:4}$
    assignment_strategy: sinkhorn
    sinkhorn_epsilon: [0.0, 0.0, 0.0, 0.003]
    sinkhorn_iters: 50
    kmeans_init: true
    kmeans_iters: 100

encoder:
  name: mlp
  config:
    hidden_dims: [2048, 1024, 512, 256, 128, 64]
    activation: relu
    use_bias: true

trainer:
  output_dir: data/${data}/embeddings/${model}.rqvae
  validation_ratio: ${validation_ratio:0.1}$
  test_ratio: ${test_ratio:0.1}$
  seed: ${seed:42}$
  epochs: ${epoch:5}$
  batch_size: ${batch_size:128}$
  learning_rate: ${lr:0.001}$
  device: ${device:auto}$
  patience: ${patience:null}$
  advice: ${advice:true}$
  show_only_best_epochs: false
  display_metrics:
    coll: true
    commit: false
    codes: true
    recon: true
    dead: true
    ppl: false
    usage: false
  save_best_by: [ loss, coll, codes, recon ]
