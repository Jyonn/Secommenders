$$import: _catalog.yaml

# Predict the Llama3-derived SID while exposing its dense content embedding
# and a Word2Vec collaborative embedding as separate history representations.
encoder:
  representations: [uid, sid_content, embedding_content, embedding_collaborative]

decoder:
  targets:
    - representation: sid_content
      decoding:
        mode: ${code_decoding:auto}$
        beam_width: ${code_beam_width:20}$
        beam_chunk_size: ${code_beam_chunk_size:80}$
        collision_loss_weight: ${code_collision_loss_weight:0.1}$
    - representation: uid
      decoding: { mode: flat }
