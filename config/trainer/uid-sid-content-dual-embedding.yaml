$$import: _catalog.yaml

# Jointly predict the Llama3-derived SID and UID while exposing dense content
# and Word2Vec collaborative embeddings as separate history representations.
encoder:
  representations: [sid_content, uid, embedding_content, embedding_collaborative]

decoder:
  targets:
    - representation: sid_content
      decoding:
        mode: ${code_decoding:auto}$
        beam_width: ${code_beam_width:20}$
        beam_chunk_size: ${code_beam_chunk_size:80}$
        collision_loss_weight: ${code_collision_loss_weight:0.1}$
    - representation: uid
      decoding: { mode: flat }
