$$import: _base.yaml

# Declarations are inert until referenced by encoder.representations or
# decoder.targets. This keeps one catalog reusable without polluting SIGNs.
representations:
  uid:
    type: uid

  uid_hierarchical:
    type: uid
    hierarchy:
      levels: ${uid_cluster_levels:auto}$
      embedding:
        source: ${uid_cluster_embedding_source:collaborative}$
        content_model: ${uid_cluster_content_model:llama3}$
        content_reduce_dim: ${uid_cluster_content_reduce_dim:64}$
        normalize_blocks: ${uid_cluster_normalize_blocks:true}$
        mix_alpha: ${uid_cluster_mix_alpha:0.5}$
      word2vec:
        vector_size: ${uid_word2vec_dim:64}$
        window: ${uid_word2vec_window:5}$
        patience: ${uid_word2vec_patience:5}$
        sg: ${uid_word2vec_sg:1}$
        negative: ${uid_word2vec_negative:5}$
        min_count: ${uid_word2vec_min_count:1}$
        workers: ${uid_word2vec_workers:4}$
        max_epochs: ${uid_word2vec_max_epochs:100}$
        learning_rate: ${uid_word2vec_learning_rate:0.003}$
        batch_size: ${uid_word2vec_batch_size:8192}$
        valid_batch_size: ${uid_word2vec_valid_batch_size:16384}$
        min_delta: ${uid_word2vec_min_delta:0.0001}$
      cluster:
        batch_size: ${uid_cluster_batch_size:4096}$
        max_iter: ${uid_cluster_max_iter:100}$
        n_init: ${uid_cluster_n_init:10}$

  sid_content:
    type: sid
    sources:
      - model: ${content_embedding_model:llama3}$
        normalize: false
        reduce_dim: 0
        weight: ${content_embedding_weight:1.0}$
    fusion: {method: concat, normalize_output: false}
    codec:
      name: ${sid_coder:rqvae}$
      export: ${sid_export:recon}$
      quantizer:
        latent_dim: ${sid_latent_dim:64}$
        reconstruction_loss: ${sid_reconstruction_loss:mse}$
        codebook_size: ${sid_codebook_size:128}$
        commitment_weight: ${sid_commitment_weight:0.25}$
        codebook_weight: ${sid_codebook_weight:1.0}$
        use_ema_codebook: ${sid_use_ema_codebook:true}$
        ema_decay: ${sid_ema_decay:0.99}$
        ema_epsilon: ${sid_ema_epsilon:0.00001}$
        dead_code_reset: ${sid_dead_code_reset:false}$
        dead_code_threshold: ${sid_dead_code_threshold:0}$
        num_quantizers: ${sid_num_quantizers:3}$
        num_codebooks: ${sid_num_codebooks:3}$
        assignment_strategy: ${sid_assignment_strategy:sinkhorn}$
        sinkhorn_epsilon: ${sid_sinkhorn_epsilon:0.0,0.0,0.003}$
        sinkhorn_iters: ${sid_sinkhorn_iters:50}$
        kmeans_init: ${sid_kmeans_init:true}$
        kmeans_iters: ${sid_kmeans_iters:100}$
      encoder:
        name: mlp
        config:
          hidden_dims: ${sid_hidden_dims:2048,1024,512,256,128}$
          activation: ${sid_activation:relu}$
          use_bias: ${sid_use_bias:true}$
      trainer:
        validation_ratio: ${sid_validation_ratio:0.1}$
        test_ratio: ${sid_test_ratio:0.1}$
        full_dataset_as_splits: ${sid_full_dataset_as_splits:true}$
        epochs: ${sid_epochs:0}$
        batch_size: ${sid_batch_size:1000}$
        learning_rate: ${sid_learning_rate:0.001}$
        patience: ${sid_patience:50}$
        save_best_by: ${sid_save_best_by:loss,coll,codes,recon}$

  sid_collaborative:
    type: sid
    sources:
      - model: word2vec
        normalize: false
        reduce_dim: 0
        weight: ${collaborative_embedding_weight:1.0}$
        config:
          vector_size: ${word2vec_dim:64}$
          window: ${word2vec_window:5}$
          patience: ${word2vec_patience:5}$
          sg: ${word2vec_sg:1}$
          negative: ${word2vec_negative:5}$
          min_count: ${word2vec_min_count:1}$
          workers: ${word2vec_workers:4}$
          max_epochs: ${word2vec_max_epochs:100}$
          learning_rate: ${word2vec_learning_rate:0.003}$
          batch_size: ${word2vec_batch_size:8192}$
          valid_batch_size: ${word2vec_valid_batch_size:16384}$
          min_delta: ${word2vec_min_delta:0.0001}$
    fusion: {method: concat, normalize_output: false}
    codec:
      name: ${sid_coder:rqvae}$
      export: ${sid_export:recon}$
      quantizer:
        latent_dim: ${sid_latent_dim:64}$
        reconstruction_loss: ${sid_reconstruction_loss:mse}$
        codebook_size: ${sid_codebook_size:128}$
        commitment_weight: ${sid_commitment_weight:0.25}$
        codebook_weight: ${sid_codebook_weight:1.0}$
        use_ema_codebook: ${sid_use_ema_codebook:true}$
        ema_decay: ${sid_ema_decay:0.99}$
        ema_epsilon: ${sid_ema_epsilon:0.00001}$
        dead_code_reset: ${sid_dead_code_reset:false}$
        dead_code_threshold: ${sid_dead_code_threshold:0}$
        num_quantizers: ${sid_num_quantizers:3}$
        num_codebooks: ${sid_num_codebooks:3}$
        assignment_strategy: ${sid_assignment_strategy:sinkhorn}$
        sinkhorn_epsilon: ${sid_sinkhorn_epsilon:0.0,0.0,0.003}$
        sinkhorn_iters: ${sid_sinkhorn_iters:50}$
        kmeans_init: ${sid_kmeans_init:true}$
        kmeans_iters: ${sid_kmeans_iters:100}$
      encoder:
        name: mlp
        config:
          hidden_dims: ${sid_hidden_dims:2048,1024,512,256,128}$
          activation: ${sid_activation:relu}$
          use_bias: ${sid_use_bias:true}$
      trainer:
        validation_ratio: ${sid_validation_ratio:0.1}$
        test_ratio: ${sid_test_ratio:0.1}$
        full_dataset_as_splits: ${sid_full_dataset_as_splits:true}$
        epochs: ${sid_epochs:0}$
        batch_size: ${sid_batch_size:1000}$
        learning_rate: ${sid_learning_rate:0.001}$
        patience: ${sid_patience:50}$
        save_best_by: ${sid_save_best_by:loss,coll,codes,recon}$

  sid_hybrid:
    type: sid
    sources:
      - model: ${content_embedding_model:llama3}$
        normalize: false
        reduce_dim: 0
        weight: ${content_embedding_weight:1.0}$
      - model: word2vec
        normalize: false
        reduce_dim: 0
        weight: ${collaborative_embedding_weight:1.0}$
        config:
          vector_size: ${word2vec_dim:64}$
          window: ${word2vec_window:5}$
          patience: ${word2vec_patience:5}$
          sg: ${word2vec_sg:1}$
          negative: ${word2vec_negative:5}$
          min_count: ${word2vec_min_count:1}$
          workers: ${word2vec_workers:4}$
          max_epochs: ${word2vec_max_epochs:100}$
          learning_rate: ${word2vec_learning_rate:0.003}$
          batch_size: ${word2vec_batch_size:8192}$
          valid_batch_size: ${word2vec_valid_batch_size:16384}$
          min_delta: ${word2vec_min_delta:0.0001}$
    fusion:
      method: ${sid_embedding_fusion:concat}$
      normalize_output: ${sid_embedding_normalize_output:false}$
    codec:
      name: ${sid_coder:rqvae}$
      export: ${sid_export:recon}$
      quantizer:
        latent_dim: ${sid_latent_dim:64}$
        reconstruction_loss: ${sid_reconstruction_loss:mse}$
        codebook_size: ${sid_codebook_size:128}$
        commitment_weight: ${sid_commitment_weight:0.25}$
        codebook_weight: ${sid_codebook_weight:1.0}$
        use_ema_codebook: ${sid_use_ema_codebook:true}$
        ema_decay: ${sid_ema_decay:0.99}$
        ema_epsilon: ${sid_ema_epsilon:0.00001}$
        dead_code_reset: ${sid_dead_code_reset:false}$
        dead_code_threshold: ${sid_dead_code_threshold:0}$
        num_quantizers: ${sid_num_quantizers:3}$
        num_codebooks: ${sid_num_codebooks:3}$
        assignment_strategy: ${sid_assignment_strategy:sinkhorn}$
        sinkhorn_epsilon: ${sid_sinkhorn_epsilon:0.0,0.0,0.003}$
        sinkhorn_iters: ${sid_sinkhorn_iters:50}$
        kmeans_init: ${sid_kmeans_init:true}$
        kmeans_iters: ${sid_kmeans_iters:100}$
      encoder:
        name: mlp
        config:
          hidden_dims: ${sid_hidden_dims:2048,1024,512,256,128}$
          activation: ${sid_activation:relu}$
          use_bias: ${sid_use_bias:true}$
      trainer:
        validation_ratio: ${sid_validation_ratio:0.1}$
        test_ratio: ${sid_test_ratio:0.1}$
        full_dataset_as_splits: ${sid_full_dataset_as_splits:true}$
        epochs: ${sid_epochs:0}$
        batch_size: ${sid_batch_size:1000}$
        learning_rate: ${sid_learning_rate:0.001}$
        patience: ${sid_patience:50}$
        save_best_by: ${sid_save_best_by:loss,coll,codes,recon}$

  embedding_content:
    type: embedding
    sources:
      - model: ${content_embedding_model:llama3}$
        normalize: ${content_embedding_normalize:false}$
        reduce_dim: ${content_embedding_dim:0}$
        weight: ${content_embedding_weight:1.0}$

  embedding_collaborative:
    type: embedding
    sources:
      - model: word2vec
        normalize: true
        reduce_dim: ${collaborative_embedding_dim:64}$
        weight: ${collaborative_embedding_weight:1.0}$
        config:
          vector_size: ${word2vec_dim:64}$
          window: ${word2vec_window:5}$
          patience: ${word2vec_patience:5}$
          sg: ${word2vec_sg:1}$
          negative: ${word2vec_negative:5}$
          min_count: ${word2vec_min_count:1}$
          workers: ${word2vec_workers:4}$
          max_epochs: ${word2vec_max_epochs:100}$
          learning_rate: ${word2vec_learning_rate:0.003}$
          batch_size: ${word2vec_batch_size:8192}$
          valid_batch_size: ${word2vec_valid_batch_size:16384}$
          min_delta: ${word2vec_min_delta:0.0001}$

  hash_content:
    type: hash
    sources:
      - model: ${content_embedding_model:llama3}$
        normalize: true
        reduce_dim: ${content_embedding_dim:256}$
        weight: ${content_embedding_weight:1.0}$
    codec:
      name: ${hash_coder:simhash}$
      quantizer:
        num_bits: ${hash_num_bits:24}$
        num_tables: ${hash_num_tables:1}$
        projection_distribution: ${hash_projection_distribution:gaussian}$
        use_median_thresholds: ${hash_use_median_thresholds:true}$
        num_iterations: ${hash_num_iterations:50}$
        normalize_inputs: ${hash_normalize_inputs:true}$

  text:
    type: text

encoder:
  representations: [uid]
  combine: concat
  max_items: ${maxitems:256}$
  model_max_length: ${model_max_length:0}$
  item_text_max_tokens: ${item_text_max_tokens:20}$

decoder:
  targets:
    - representation: uid
      decoding: {mode: flat}
