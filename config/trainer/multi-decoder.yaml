extends: hybrid.yaml

encoder:
  representations: [sid_hybrid, uid, embedding_content, embedding_collaborative]

decoder:
  targets:
    - representation: sid_hybrid
      decoding:
        mode: ${code_decoding:auto}$
        beam_width: ${code_beam_width:20}$
        beam_chunk_size: ${code_beam_chunk_size:80}$
        collision_loss_weight: ${code_collision_loss_weight:0.1}$
    - representation: uid
      decoding: {mode: flat}
  multiple:
    candidate_topk: ${multi_candidate_topk:100}$
    output_topk: ${multi_output_topk:20}$
    fusion:
      mode: ${multi_fusion:frequency}$
      uid_weight: ${multi_uid_weight:0.5}$
      score_normalization: ${multi_score_normalization:zscore}$
      temperature_uid: ${multi_temperature_uid:1.0}$
      temperature_sid: ${multi_temperature_sid:1.0}$
    frequency:
      threshold: ${multi_frequency_threshold:5}$
      smoothing: ${multi_frequency_smoothing:2.0}$
