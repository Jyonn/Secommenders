data:
  name: ${data}$
  repr_type: ${repr_type:null}$
  repr_model: ${repr_model:null}$
  repr_best: ${repr_best:coll}$
  repr_combine: ${repr_combine:concat}$
  task_type: ${task_type}$
  maxitems: ${maxitems:0}$
  item_text_max_tokens: ${item_text_max_tokens:50}$

model:
  name: ${model}$
  max_length: ${model_max_length:0}$
  dtype: ${model_dtype:bfloat16}$
  lora:
    use: ${use_lora:auto}$
    rank: ${lora_rank:16}$
    alpha: ${lora_alpha:32}$
    dropout: ${lora_dropout:0.05}$
  config:
    hidden_size: ${hidden_size:256}$
    num_layers: ${num_layers:4}$
    num_heads: ${num_heads:8}$
    dropout: ${dropout:0.1}$

trainer:
  batch_size: ${batch_size:64}$
  epochs: ${epochs:0}$
  learning_rate: ${learning_rate:0.0001}$
  weight_decay: ${weight_decay:0.01}$
  seed: ${seed:42}$
  device: ${device:null}$
  num_gpus: ${num_gpus:1}$
  freeze_backbone: ${freeze_backbone:auto}$
  sid_beam_width: ${sid_beam_width:20}$
  alignment:
    enable: ${alignment_enable:false}$
    weight: ${alignment_weight:0.1}$

evaluator:
  main_metric: ${main_metric:loss}$
  patience: ${patience:3}$
  metrics:
    - ndcg@5
    - ndcg@10
    - ndcg@20
    - hr@5
    - hr@10
    - hr@20
    - mrr
