name: ${name:experiment}$

data:
  name: ${data}$

representation:
  history: ${repr_type:null}$
  target: ${task_repr:null}$
  legacy_target: ${task_type:null}$
  source_model: ${repr_source_model:null}$
  embedding:
    models: ${repr_embedding_models:null}$
    normalize: ${repr_embedding_normalize:null}$
    reduce_dims: ${repr_embedding_reduce_dims:null}$
    weights: ${repr_embedding_weights:null}$
    fusion: ${repr_embedding_fusion:concat}$
    normalize_output: ${repr_embedding_normalize_output:false}$
    seed: 42
    word2vec:
      vector_size: ${repr_word2vec_vector_size:64}$
      window: ${repr_word2vec_window:5}$
      patience: ${repr_word2vec_patience:5}$
      sg: ${repr_word2vec_sg:1}$
      negative: ${repr_word2vec_negative:5}$
      min_count: ${repr_word2vec_min_count:1}$
      max_epochs: ${repr_word2vec_max_epochs:100}$
      learning_rate: ${repr_word2vec_learning_rate:0.003}$
      batch_size: ${repr_word2vec_batch_size:8192}$
      valid_batch_size: ${repr_word2vec_valid_batch_size:16384}$
      min_delta: ${repr_word2vec_min_delta:0.0001}$
  combine: ${repr_combine:concat}$
  max_items: ${maxitems:50}$
  model_max_length: ${model_max_length:0}$
  item_text_max_tokens: ${item_text_max_tokens:20}$

upstreams:
  sid:
    kind: quantized
    embedding_model: ${sid_embedding_model:null}$
    embedding:
      models: ${sid_embedding_models:null}$
      normalize: ${sid_embedding_normalize:null}$
      reduce_dims: ${sid_embedding_reduce_dims:null}$
      weights: ${sid_embedding_weights:null}$
      fusion: ${sid_embedding_fusion:concat}$
      normalize_output: ${sid_embedding_normalize_output:false}$
      seed: 42
      word2vec:
        vector_size: ${sid_word2vec_vector_size:64}$
        window: ${sid_word2vec_window:5}$
        patience: ${sid_word2vec_patience:5}$
        sg: ${sid_word2vec_sg:1}$
        negative: ${sid_word2vec_negative:5}$
        min_count: ${sid_word2vec_min_count:1}$
        max_epochs: ${sid_word2vec_max_epochs:100}$
        learning_rate: ${sid_word2vec_learning_rate:0.003}$
        batch_size: ${sid_word2vec_batch_size:8192}$
        valid_batch_size: ${sid_word2vec_valid_batch_size:16384}$
        min_delta: ${sid_word2vec_min_delta:0.0001}$
    export: ${sid_export:coll}$
    quantizer:
      name: ${sid_coder:rqvae}$
      config:
        latent_dim: ${sid_latent_dim:64}$
        reconstruction_loss: ${sid_reconstruction_loss:mse}$
        codebook_size: ${sid_codebook_size:256}$
        commitment_weight: ${sid_commitment_weight:0.25}$
        codebook_weight: ${sid_codebook_weight:1.0}$
        use_ema_codebook: ${sid_use_ema_codebook:true}$
        ema_decay: ${sid_ema_decay:0.99}$
        ema_epsilon: ${sid_ema_epsilon:0.00001}$
        dead_code_reset: ${sid_dead_code_reset:false}$
        dead_code_threshold: ${sid_dead_code_threshold:0}$
        num_quantizers: ${sid_num_quantizers:3}$
        num_codebooks: ${sid_num_codebooks:3}$
        assignment_strategy: ${sid_assignment_strategy:sinkhorn}$
        sinkhorn_epsilon: ${sid_sinkhorn_epsilon:0.0,0.0,0.003}$
        sinkhorn_iters: ${sid_sinkhorn_iters:50}$
        kmeans_init: ${sid_kmeans_init:true}$
        kmeans_iters: ${sid_kmeans_iters:100}$
    encoder:
      name: ${sid_encoder_name:mlp}$
      config:
        hidden_dims: ${sid_hidden_dims:2048,1024,512,256,128}$
        activation: ${sid_activation:relu}$
        use_bias: ${sid_use_bias:true}$
    trainer:
      validation_ratio: ${sid_validation_ratio:0.1}$
      test_ratio: ${sid_test_ratio:0.1}$
      full_dataset_as_splits: ${sid_full_dataset_as_splits:true}$
      epochs: ${sid_epochs:0}$
      batch_size: ${sid_batch_size:1000}$
      learning_rate: ${sid_lr:0.001}$
      patience: ${sid_patience:50}$
      save_best_by: ${sid_save_best_by:loss,coll,codes,recon}$

  hash:
    kind: quantized
    embedding_model: ${hash_embedding_model:null}$
    embedding:
      models: ${hash_embedding_models:null}$
      normalize: ${hash_embedding_normalize:null}$
      reduce_dims: ${hash_embedding_reduce_dims:null}$
      weights: ${hash_embedding_weights:null}$
      fusion: ${hash_embedding_fusion:concat}$
      normalize_output: ${hash_embedding_normalize_output:false}$
      seed: 42
    export: hash
    quantizer:
      name: ${hash_coder:simhash}$
      config:
        num_bits: ${hash_num_bits:24}$
        num_tables: ${hash_num_tables:1}$
        projection_distribution: ${hash_projection_distribution:gaussian}$
        use_median_thresholds: ${hash_use_median_thresholds:true}$
        num_iterations: ${hash_num_iterations:50}$
        normalize_inputs: ${hash_normalize_inputs:true}$

  uid:
    kind: clustered
    clusterer:
      levels: ${uid_cluster_levels:auto}$
      embedding:
        source: ${uid_cluster_embedding_source:collaborative}$
        content_model: ${uid_cluster_content_model:null}$
        content_reduce_dim: ${uid_cluster_content_reduce_dim:128}$
        normalize_blocks: ${uid_cluster_normalize_blocks:true}$
        mix_alpha: ${uid_cluster_mix_alpha:0.5}$
      word2vec:
        vector_size: ${cluster_vector_size:64}$
        window: ${cluster_window:5}$
        patience: ${cluster_patience:5}$
        sg: ${cluster_sg:1}$
        negative: ${cluster_negative:5}$
        min_count: ${cluster_min_count:1}$
        workers: ${cluster_workers:4}$
        seed: ${cluster_seed:42}$
        max_epochs: ${cluster_max_epochs:100}$
        learning_rate: ${cluster_learning_rate:0.003}$
        batch_size: ${cluster_word2vec_batch_size:8192}$
        valid_batch_size: ${cluster_valid_batch_size:16384}$
        min_delta: ${cluster_min_delta:0.0001}$
      cluster:
        batch_size: ${cluster_batch_size:4096}$
        max_iter: ${cluster_max_iter:100}$
        n_init: ${cluster_n_init:10}$

model:
  name: ${model}$
  dtype: ${model_dtype:auto}$
  freeze_backbone: ${freeze_backbone:auto}$
  max_length: ${model_max_length:0}$
  lora:
    use: ${use_lora:auto}$
    rank: ${lora_rank:8}$
    alpha: ${lora_alpha:32}$
    dropout: ${lora_dropout:0.05}$
    layers: ${lora_layers:null}$
    target_modules: ${lora_target_modules:all-linear}$
  scratch:
    hidden_size: ${hidden_size:256}$
    num_layers: ${num_layers:4}$
    num_heads: ${num_heads:8}$
    dropout: ${dropout:0.1}$

decoder:
  uid:
    mode: ${uid_decoding:flat}$
    topk: ${uid_cluster_topk:null}$
  sid:
    mode: ${code_decoding:auto}$
    beam_width: ${code_beam_width:20}$
    beam_chunk_size: ${code_beam_chunk_size:0}$
    collision_loss_weight: ${code_collision_loss_weight:0.1}$
  hash:
    mode: parallel
  multi:
    candidate_topk: ${multi_candidate_topk:100}$
    output_topk: ${multi_output_topk:20}$
    fusion:
      mode: ${multi_fusion:frequency}$
      uid_weight: ${multi_uid_weight:0.5}$
      score_normalization: ${multi_score_normalization:zscore}$
      temperature_uid: ${multi_temperature_uid:1.0}$
      temperature_sid: ${multi_temperature_sid:1.0}$
    frequency:
      threshold: ${multi_frequency_threshold:5}$
      smoothing: ${multi_frequency_smoothing:2.0}$

trainer:
  batch_size: ${batch_size:64}$
  accumulate_batch: ${accumulate_batch:1}$
  valid_only: ${valid_only:false}$
  test_only: ${test_only:false}$
  load_ckpt: ${load_ckpt:null}$
  overwrite: ${overwrite:auto}$
  epochs: ${epochs:0}$
  learning_rate: ${learning_rate:0.0001}$
  weight_decay: ${weight_decay:0.01}$
  lr_scheduler: ${lr_scheduler:constant}$
  warmup_ratio: ${warmup_ratio:0.0}$
  seed: ${seed:42}$
  device: ${device:null}$
  num_gpus: ${num_gpus:1}$
  alignment: ${alignment:0}$
  multi:
    uid_loss_weight: ${multi_uid_loss_weight:1.0}$
    sid_loss_weight: ${multi_sid_loss_weight:1.0}$
    fused_loss_weight: ${multi_fused_loss_weight:0.0}$
    consistency_weight: ${multi_consistency_weight:0.0}$

evaluator:
  main_metric: ${main_metric:ndcg@10}$
  patience: ${patience:3}$
  metrics: ${metrics:ndcg@5,ndcg@10,ndcg@20,hr@5,hr@10,hr@20,mrr}$
  frequency_breakdown: ${frequency_breakdown:false}$
  frequency_buckets: ${frequency_buckets:0,5,20,100}$
