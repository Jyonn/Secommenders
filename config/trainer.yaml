data:
  name: ${data}$
  repr_type: ${repr_type:null}$
  repr_source_model: ${repr_source_model:null}$
  sid_export: ${sid_export:coll}$
  sid_coder: ${sid_coder:null}$
  hash_coder: ${hash_coder:null}$
  repr_combine: ${repr_combine:concat}$
  task_type: ${task_type}$
  maxitems: ${maxitems:20}$
  item_text_max_tokens: ${item_text_max_tokens:20}$

model:
  name: ${model}$
  max_length: ${model_max_length:0}$
  dtype: ${model_dtype:auto}$
  lora:
    use: ${use_lora:auto}$
    rank: ${lora_rank:8}$
    alpha: ${lora_alpha:32}$
    dropout: ${lora_dropout:0.05}$
    layers: ${lora_layers:null}$
  config:
    hidden_size: ${hidden_size:256}$
    num_layers: ${num_layers:4}$
    num_heads: ${num_heads:8}$
    dropout: ${dropout:0.1}$

trainer:
  batch_size: ${batch_size:64}$
  accumulate_batch: ${accumulate_batch:1}$
  valid_only: ${valid_only:false}$
  test_only: ${test_only:false}$
  load_ckpt: ${load_ckpt:null}$
  epochs: ${epochs:0}$
  learning_rate: ${learning_rate:0.0001}$
  weight_decay: ${weight_decay:0.01}$
  seed: ${seed:42}$
  device: ${device:null}$
  num_gpus: ${num_gpus:1}$
  freeze_backbone: ${freeze_backbone:auto}$
  uid_decoding: ${uid_decoding:flat}$
  uid_cluster_levels: ${uid_cluster_levels:null}$
  uid_cluster_topk: ${uid_cluster_topk:null}$
  code_decoding: ${code_decoding:auto}$
  code_beam_width: ${code_beam_width:20}$
  code_beam_chunk_size: ${code_beam_chunk_size:0}$
  code_collision_loss_weight: ${code_collision_loss_weight:0.1}$
  alignment: ${alignment:0}$

evaluator:
  main_metric: ${main_metric:loss}$
  patience: ${patience:3}$
  metrics:
    - ndcg@5
    - ndcg@10
    - ndcg@20
    - hr@5
    - hr@10
    - hr@20
    - mrr
