name: mindf_multi_representation_replications
poll_interval_seconds: 15
effective_batch_size: 64
experiments:
- name: mindf_multi_repr_none_s42
  args:
    config: config/trainer/sid-uid-content-multi-decoder.yaml
    data: mindf
    model: scratch
    main_metric: ndcg@10|loss
    maxitems: 256
    batch_size: 16
    accumulate_batch: 4
    code_beam_chunk_size: 80
    multi_uid_weight: 0.5
    representation_pair_bias: false
    seed: 42
    sid_codebook_size: 128
    content_embedding_normalize: false
    content_embedding_dim: 0
  batch_size_cap: 16
